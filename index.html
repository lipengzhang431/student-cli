<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streaming Chat Bot</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 12px; background: #f7f7f8; }
  h1 { font-size: 18px; }
  #chat { display: flex; flex-direction: column; gap: 8px; min-height: 300px; }
  .msg { padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; max-width: 85%; }
  .user { align-self: flex-end; background: #3b82f6; color: #fff; }
  .bot  { align-self: flex-start; background: #fff; border: 1px solid #e5e5e5; }
  .meta { font-size: 12px; color: #888; }
  .bar { display: flex; gap: 8px; margin-top: 16px; }
  #inp { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
  #send { padding: 10px 18px; border: 0; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; }
  #send:disabled { background: #9cb8e8; cursor: wait; }
</style>
</head>
<body>
<h1>流式聊天（服务端管历史）</h1>
<div id="chat"></div>
<div class="bar">
  <input id="inp" placeholder="输入消息，回车发送" autofocus>
  <button id="send">发送</button>
</div>

<script>
// 会话 id：localStorage 持久化，刷新页面可接着同一份历史聊
let sessionId = localStorage.getItem("sid") || crypto.randomUUID();
localStorage.setItem("sid", sessionId);

const chat = document.getElementById("chat");
const inp = document.getElementById("inp");
const sendBtn = document.getElementById("send");

function addLine(cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  chat.appendChild(div);
  return div;
}

async function send() {
  const text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  sendBtn.disabled = true;
  addLine("user").textContent = text;
  const out = addLine("bot");

  const res = await fetch("/api/bot/stream", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, message: text }),
  });

  // ---- SSE 解析：reader 循环 + 按空行切块，半条消息留到下一轮 ----
  const reader = res.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const parts = buf.split("\n\n");
    buf = parts.pop();                    // 末尾可能是半条，留到下一轮
    for (const p of parts) {
      if (!p.startsWith("data: ")) continue;
      const s = p.slice(6);
      if (s === "[DONE]") { sendBtn.disabled = false; inp.focus(); return; }
      const obj = JSON.parse(s);
      if (obj.session_id) sessionId = obj.session_id;
      if (obj.content) out.textContent += obj.content;   // 逐字追加
      if (obj.total_tokens !== undefined) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = "[累计 token: " + obj.total_tokens + "]";
        out.appendChild(meta);
      }
      if (obj.error) out.textContent += "\n[错误] " + obj.error;
    }
  }
  sendBtn.disabled = false;
  inp.focus();
}

sendBtn.onclick = send;
inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
